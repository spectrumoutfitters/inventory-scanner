<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Inventory">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#1f6feb">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 180 180'%3E%3Crect width='180' height='180' rx='36' fill='%231f6feb'/%3E%3Ctext x='90' y='120' font-size='100' text-anchor='middle'%3E📦%3C/text%3E%3C/svg%3E">
<title>Inventory</title>
<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{font-family:-apple-system,Helvetica,sans-serif;margin:0;background:#f4f5f7;color:#111;font-size:18px;padding:calc(env(safe-area-inset-top) + 8px) 12px calc(env(safe-area-inset-bottom) + 96px)}
h1{font-size:24px;margin:6px 0 10px;display:flex;justify-content:space-between;align-items:center} h2{font-size:20px;margin:6px 0 10px}
.card{background:#fff;border-radius:14px;padding:14px;margin-bottom:12px;box-shadow:0 1px 3px #0002}
input,select,textarea{width:100%;font-size:19px;padding:13px;border:1px solid #bbb;border-radius:10px;margin:4px 0 12px;background:#fff;-webkit-appearance:none}
label{font-weight:600;font-size:15px;color:#444;display:block}
button{width:100%;font-size:19px;font-weight:700;padding:16px;border:0;border-radius:12px;margin:5px 0;background:#1f6feb;color:#fff}
button.sec{background:#e3e6ea;color:#111} button.green{background:#1a7f37} button.red{background:#cf222e} button.sm{width:auto;padding:9px 14px;font-size:15px;margin:0}
.row{display:flex;gap:10px;align-items:center} .row>*{flex:1}
.qty{font-size:30px;text-align:center;font-weight:700} .stepper button{font-size:28px;flex:0 0 64px}
.muted{color:#666;font-size:15px} .big{font-size:21px;font-weight:700}
.msg{position:fixed;left:12px;right:12px;top:calc(env(safe-area-inset-top) + 8px);z-index:60;padding:14px;border-radius:12px;font-weight:600;box-shadow:0 4px 14px #0003}
.ok{background:#dafbe1} .err{background:#ffebe9} .hide{display:none!important}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.stat{background:#fff;border-radius:14px;padding:12px;box-shadow:0 1px 3px #0002} .stat b{display:block;font-size:24px} .stat span{font-size:13px;color:#666;font-weight:600}
.stat.tap{cursor:pointer} .warn b{color:#cf222e}
table.s{width:100%;border-collapse:collapse;font-size:15px} table.s td,table.s th{padding:7px 4px;text-align:right;border-bottom:1px solid #eee} table.s td:first-child,table.s th:first-child{text-align:left}
.pos{color:#1a7f37} .neg{color:#cf222e}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px;margin-bottom:6px;-webkit-overflow-scrolling:touch}
.chip{flex:0 0 auto;padding:8px 14px;border-radius:20px;background:#e3e6ea;font-size:15px;font-weight:600;white-space:nowrap}
.chip.on{background:#111;color:#fff}
.li{display:flex;gap:12px;align-items:center;background:#fff;border-radius:12px;padding:10px;margin-bottom:8px;box-shadow:0 1px 2px #0002}
.li .t{flex:1;min-width:0} .li .n{font-weight:700;font-size:16px;overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.li .r{text-align:right;font-weight:700;font-size:16px;white-space:nowrap}
.th{width:56px;height:56px;border-radius:10px;object-fit:cover;background:#eef0f3;flex:0 0 56px;display:flex;align-items:center;justify-content:center;font-size:26px;overflow:hidden}
.th img{width:100%;height:100%;object-fit:cover} .th.lg{width:120px;height:120px;flex-basis:120px;font-size:50px}
.badge{display:inline-block;font-size:12px;font-weight:700;padding:2px 7px;border-radius:8px;margin:2px 4px 0 0;background:#eef0f3;color:#444}
.badge.red{background:#ffebe9;color:#cf222e} .badge.grn{background:#dafbe1;color:#1a7f37} .badge.yel{background:#fff8c5;color:#7d4e00}
.tabbar{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid #ddd;display:flex;padding-bottom:env(safe-area-inset-bottom);z-index:40}
.tabbar a{flex:1;text-align:center;padding:9px 0 7px;font-size:12px;font-weight:600;color:#666;text-decoration:none} .tabbar a i{display:block;font-style:normal;font-size:24px}
.tabbar a.on{color:#1f6feb}
.sheet{position:fixed;inset:0;background:#0006;z-index:50;display:flex;align-items:flex-end}
.sheet>.in{background:#f4f5f7;width:100%;max-height:94vh;overflow-y:auto;border-radius:18px 18px 0 0;padding:14px 12px calc(env(safe-area-inset-bottom) + 20px);-webkit-overflow-scrolling:touch}
.photos{display:flex;gap:8px;flex-wrap:wrap;margin:6px 0 10px} .photos .p{position:relative;width:88px;height:88px;border-radius:10px;overflow:hidden;background:#eef0f3}
.photos .p i{position:absolute;left:0;right:0;bottom:0;background:#000a;color:#fff;font-size:11px;font-style:normal;padding:2px 4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.shotimg{width:100%;max-height:46vh;object-fit:contain;border-radius:12px;background:#eef0f3;display:block;margin:8px 0}
.dots{display:flex;gap:6px;margin:6px 0}.dots span{flex:1;height:6px;border-radius:3px;background:#ddd}.dots span.d{background:#1a7f37}.dots span.c{background:#1f6feb}.dots span.s{background:#bbb}
.photos .p img{width:100%;height:100%;object-fit:cover} .photos .p b{position:absolute;top:3px;right:3px;background:#000a;color:#fff;border-radius:50%;width:26px;height:26px;text-align:center;line-height:26px;font-size:16px}
#reader{width:100%;border-radius:12px;overflow:hidden;margin-bottom:8px} #reader video{width:100%!important;border-radius:12px}
.seg{display:flex;gap:8px;margin-bottom:10px} .seg button{flex:1;margin:0} .seg button.on{background:#111;color:#fff} .seg button:not(.on){background:#e3e6ea;color:#111}
#updBar{position:fixed;left:12px;right:12px;bottom:calc(env(safe-area-inset-bottom) + 76px);z-index:45;background:#111;color:#fff;padding:14px;border-radius:12px;text-align:center;font-weight:700}
footer{text-align:center;color:#999;font-size:13px;margin:18px 0}
.profit{font-size:20px;font-weight:700;padding:10px;border-radius:10px;background:#eef0f3;margin-bottom:10px}
</style>
</head>
<body>
<div id="msg"></div>
<div id="updBar" class="hide" onclick="doUpdate()">New version available. Tap to update</div>

<div id="pinView" class="card" style="margin-top:30px">
  <h2>📦 Inventory</h2>
  <label>PIN</label><input id="pin" type="password" inputmode="numeric" autocomplete="off" onkeydown="if(event.key==='Enter')login()">
  <button onclick="login()">Unlock</button>
</div>

<div id="app" class="hide">
  <!-- DASHBOARD -->
  <section id="v-dash">
    <h1>📦 Dashboard <button class="sm sec" onclick="refresh(true)">↻</button></h1>
    <div class="muted" id="dUpd" style="margin:-6px 0 8px"></div>
    <div class="grid" id="dStats"></div>
    <div class="card"><h2>Sales</h2><table class="s" id="dSales"></table><div class="muted" id="dSalesNote"></div></div>
    <div class="row"><button class="green" onclick="go('scan');setMode('add')">📷 Add stock</button><button onclick="go('sell')">💵 Record sale</button></div>
  </section>

  <!-- INVENTORY -->
  <section id="v-inv" class="hide">
    <h1>Inventory <span class="muted" id="iCount"></span></h1>
    <input id="iSearch" type="search" placeholder="Search name, set, barcode…" oninput="renderInv()">
    <div class="chips" id="iChips"></div>
    <div class="chips" id="iFilters"></div>
    <div class="seg" id="iSort"><button data-s="name" class="on">Name</button><button data-s="qty">Qty</button><button data-s="value">Value</button></div>
    <div id="iList"></div>
  </section>

  <!-- SCAN / ADD -->
  <section id="v-scan" class="hide">
    <h1>Scan</h1>
    <div class="seg"><button id="mAdd" class="on" onclick="setMode('add')">Add stock</button><button id="mSale" onclick="setMode('sale')">Record sale</button></div>
    <div class="card" id="scanCard">
      <div id="reader" class="hide"></div>
      <button id="camBtn" onclick="startCam()">📷 Start scanning</button>
      <button id="stopBtn" class="sec hide" onclick="stopCam()">Stop camera</button>
      <div class="muted">Point at the barcode. It scans by itself.</div>
      <label style="margin-top:10px">Or type barcode</label>
      <input id="manual" inputmode="numeric" autocomplete="off" onkeydown="if(event.key==='Enter')lookup(val('manual'))">
      <button class="sec" onclick="lookup(val('manual'))">Look up</button>
    </div>
    <div class="card hide" id="existCard">
      <div class="row" style="align-items:flex-start"><div class="th lg" id="exThumb" style="flex:0 0 120px"></div><div><div class="big" id="exName"></div><div class="muted" id="exInfo"></div></div></div>
      <label style="margin-top:10px">Change qty by</label>
      <div class="row stepper"><button class="sec" onclick="bump('delta',-1)">−</button><input id="delta" class="qty" type="number" value="1"><button class="sec" onclick="bump('delta',1)">+</button></div>
      <label>Unit cost (optional)</label><input id="exCost" type="number" step="0.01" inputmode="decimal">
      <label>Notes (optional)</label><input id="exNotes">
      <button class="green" onclick="saveExisting()">Save</button>
      <button class="sec" onclick="addPhotosFor(cur)">📸 Add photos</button>
      <button class="sec" onclick="openItem(cur)">Open item</button>
      <button class="sec" onclick="resetScan()">Cancel</button>
    </div>
    <div class="card hide" id="newCard">
      <h2>New item</h2>
      <div class="row" style="align-items:flex-start"><div class="th lg" id="nThumb" style="flex:0 0 120px"></div><div class="muted" id="newCode"></div></div>
      <label style="margin-top:10px">Photos (front shot required)</label>
      <div class="photos" id="nPhotos"></div>
      <button class="sec" id="nShotBtn" onclick="shootNew()">📸 Take photos</button>
      <label>Product</label><input id="nProduct">
      <label>Category</label><input id="nCategory" list="catList" placeholder="e.g. Pokémon, Sports cards">
      <label>Set</label><input id="nSet">
      <label>Type</label><input id="nType" placeholder="e.g. ETB, Booster box">
      <label>Condition</label><select id="nCondition"><option>Sealed</option><option>Raw</option></select>
      <label>Qty</label><div class="row stepper"><button class="sec" onclick="bump('nQty',-1)">−</button><input id="nQty" class="qty" type="number" value="1"><button class="sec" onclick="bump('nQty',1)">+</button></div>
      <label>Unit cost</label><input id="nCost" type="number" step="0.01" inputmode="decimal">
      <label>FB price (optional)</label><input id="nFb" type="number" step="5" inputmode="numeric">
      <label>Notes</label><input id="nNotes">
      <button class="green" onclick="saveNew()">Save new item</button>
      <button class="sec" onclick="resetScan()">Cancel</button>
    </div>
  </section>

  <!-- SELL -->
  <section id="v-sell" class="hide">
    <h1>Record sale</h1>
    <button onclick="go('scan');setMode('sale');startCam()">📷 Scan to sell</button>
    <input id="sSearch" type="search" placeholder="Or search product…" oninput="renderSell()" style="margin-top:8px">
    <div id="sList"></div>
  </section>

  <!-- SALES HISTORY -->
  <section id="v-sales" class="hide">
    <h1>Sales <span class="muted" id="hCount"></span></h1>
    <div id="hList"></div>
    <h2 style="margin-top:18px">Recent activity</h2>
    <div id="aList"></div>
  </section>

  <footer>Inventory <span id="verTxt"></span> · <a href="#" onclick="logout();return false">Log out</a></footer>
</div>

<!-- item detail sheet -->
<div class="sheet hide" id="itemSheet" onclick="if(event.target===this)closeSheet('itemSheet')"><div class="in" id="itemIn"></div></div>
<!-- sale sheet -->
<div class="sheet hide" id="saleSheet" onclick="if(event.target===this)closeSheet('saleSheet')"><div class="in">
  <div class="row" style="align-items:flex-start"><div class="th lg" id="sThumb" style="flex:0 0 120px"></div><div><div class="big" id="sName"></div><div class="muted" id="sInfo"></div></div></div>
  <label style="margin-top:10px">Qty sold</label>
  <div class="row stepper"><button class="sec" onclick="bumpSaleQty(-1)">−</button><input id="sQty" class="qty" type="number" value="1" oninput="saleCalc(true)"><button class="sec" onclick="bumpSaleQty(1)">+</button></div>
  <label>Total price ($, ends in 0 or 5)</label>
  <div class="row stepper"><button class="sec" onclick="bumpPrice(-5)">−</button><input id="sPrice" class="qty" type="number" step="5" inputmode="numeric" oninput="saleCalc()"><button class="sec" onclick="bumpPrice(5)">+</button></div>
  <div class="profit" id="sProfit"></div>
  <label>Platform</label><select id="sPlatform"><option>Facebook Marketplace</option><option>eBay</option><option>In person</option><option>Whatnot</option><option>Other</option></select>
  <label>Buyer (optional)</label><input id="sBuyer">
  <button class="green" onclick="saveSale()">Record sale</button>
  <button class="sec" onclick="closeSheet('saleSheet')">Cancel</button>
</div></div>
<div class="sheet hide" id="shotSheet"><div class="in">
  <div class="muted" id="shProg"></div><div class="dots" id="shDots"></div>
  <div class="big" id="shLabel"></div>
  <div class="muted">Plain background, good light, fill the frame, no glare.</div>
  <img id="shImg" class="shotimg hide">
  <button id="shTake" onclick="$('shotFile').click()">📸 Take photo</button>
  <button id="shUse" class="green hide" onclick="shotNext(true)">Use photo ✓</button>
  <button id="shRetake" class="sec hide" onclick="$('shotFile').click()">Retake</button>
  <button id="shSkip" class="sec" onclick="shotNext(false)">Skip</button>
  <div class="row"><button class="sec" id="shBack" onclick="shotBack()">‹ Back</button><button class="sec" onclick="shotDone()">Done</button></div>
  <button class="sec" onclick="shotCancel()">Cancel</button>
</div></div>
<input id="shotFile" type="file" accept="image/*" capture="environment" class="hide" onchange="shotTaken(this)">
<datalist id="catList"></datalist>

<div class="tabbar">
  <a href="#" data-v="dash" class="on" onclick="go('dash');return false"><i>🏠</i>Home</a>
  <a href="#" data-v="inv" onclick="go('inv');return false"><i>📋</i>Inventory</a>
  <a href="#" data-v="scan" onclick="go('scan');return false"><i>📷</i>Scan</a>
  <a href="#" data-v="sell" onclick="go('sell');return false"><i>💵</i>Sell</a>
  <a href="#" data-v="sales" onclick="go('sales');return false"><i>🧾</i>Sales</a>
</div>

<script>
var VERSION = '2.1.0';
var EXEC = 'https://script.google.com/macros/s/AKfycbzSA8CPJPQMDspoRCdxhfdEKRqwb88b0TyA0XFEeZ8boWCng5QWvSCAex12EAhNeQzIZg/exec';
var PIN = '', D = null, mode = 'add', cur = null, code = '', idRes = null, scanner = null, busy = false, saleItem = null;
var cat = 'All', flt = '', sortBy = 'name', pending = [], photoTarget = null;

function $(id){return document.getElementById(id)}
function val(id){return $(id).value.trim()}
function show(id,on){$(id).classList.toggle('hide',!on)}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
var msgT=null;function msg(t,ok,stay){clearTimeout(msgT);$('msg').innerHTML=t?'<div class="msg '+(ok?'ok':'err')+'" onclick="msg(\'\')">'+esc(t)+'</div>':'';if(t&&!stay)msgT=setTimeout(function(){msg('')},ok?3500:7000)}
function money(n){if(n==null||n==='')return '—';n=Number(n);return (n<0?'−$':'$')+Math.abs(n).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2})}
function money0(n){n=Number(n||0);return (n<0?'−$':'$')+Math.abs(n).toLocaleString('en-US',{maximumFractionDigits:0})}
function fail(e){busy=false;msg(e&&e.message?e.message:String(e),false)}
$('verTxt').textContent='v'+VERSION;

/* ---------- API ---------- */
function call(action,body){body=body||{};body.action=action;body.pin=PIN;
  return fetch(EXEC,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(body),redirect:'follow'})
  .then(function(r){return r.text()}).then(function(t){var j;try{j=JSON.parse(t)}catch(e){throw new Error('Server not updated yet. Redeploy Code.gs as a new version.')}
    if(!j.ok){if(/Unknown action/.test(j.error))throw new Error('Server not updated yet. Redeploy Code.gs as a new version.');throw new Error(j.error||'Error')}return j.result})}

/* ---------- login / data ---------- */
function login(){PIN=val('pin');if(!PIN)return;
  try{var c=localStorage.dash&&JSON.parse(localStorage.dash);if(c&&localStorage.pin===PIN){D=c;enter();}}catch(e){}
  refresh(false).then(function(){try{localStorage.pin=PIN}catch(e){}if($('app').classList.contains('hide'))enter()})
  .catch(function(e){if(/Wrong PIN|Too many/.test(e.message)){try{localStorage.removeItem('pin');localStorage.removeItem('dash')}catch(x){}show('app',false);show('pinView',true)}fail(e)})}
function enter(){show('pinView',false);show('app',true);renderAll()}
function logout(){try{localStorage.removeItem('pin');localStorage.removeItem('dash')}catch(e){}location.reload()}
var refreshing=null;
function refresh(manual){if(refreshing)return refreshing;if(manual)msg('Refreshing…',true);
  refreshing=call('dashboard').then(function(d){D=d;try{localStorage.dash=JSON.stringify(d)}catch(e){}renderAll();if(manual)msg('Up to date',true);refreshing=null})
  .catch(function(e){refreshing=null;throw e});return refreshing}
function after(){return refresh(false).catch(function(){})}
try{if(localStorage.pin){$('pin').value=localStorage.pin;login()}}catch(e){}
document.addEventListener('visibilitychange',function(){if(!document.hidden&&PIN){after();checkUpdate()}});

/* ---------- update check ---------- */
var newVer='';
function checkUpdate(){fetch(location.pathname+'?v='+Date.now(),{cache:'no-store'}).then(function(r){return r.text()}).then(function(t){
  var m=t.match(/var VERSION = '([^']+)'/);if(m&&m[1]!==VERSION){newVer=m[1];show('updBar',true)}}).catch(function(){})}
function doUpdate(){location.replace(location.pathname+'?v='+encodeURIComponent(newVer||Date.now()))}
checkUpdate();setInterval(checkUpdate,10*60*1000);

/* ---------- navigation ---------- */
function go(v){['dash','inv','scan','sell','sales'].forEach(function(x){show('v-'+x,x===v)});
  document.querySelectorAll('.tabbar a').forEach(function(a){a.classList.toggle('on',a.dataset.v===v)});
  if(v!=='scan')stopCam();window.scrollTo(0,0)}
function closeSheet(id){show(id,false);document.body.style.overflow=''}
function openSheet(id){show(id,true);document.body.style.overflow='hidden'}

/* ---------- thumbnails ---------- */
function front(it){var ps=(it&&it.photos)||[];return ps.filter(function(p){return /^front/i.test(p.label)})[0]||null}
function hasFront(it){return !!front(it)}
function dthumb(id){return 'https://drive.google.com/thumbnail?id='+encodeURIComponent(id)+'&sz=w400'}
function thumbUrl(it){if(!it)return '';var f=front(it)||((it.photos||[])[0]);if(f)return dthumb(f.id);return it.imageUrl||''}
function thumbHtml(it,lg){var u=thumbUrl(it),ic=icon(it);return '<div class="th'+(lg?' lg':'')+'">'+(u?'<img loading="lazy" src="'+esc(u)+'" onerror="this.parentNode.textContent=\''+ic+'\'">':ic)+'</div>'}
function icon(it){var c=(it&&it.category||'').toLowerCase();return /pok/.test(c)?'⚡':/sport/.test(c)?'🏈':/magic/.test(c)?'🔮':/game|ps5|console/.test(c)?'🎮':'📦'}
function setThumb(id,it){$(id).outerHTML=thumbHtml(it,true).replace('<div class="th lg"','<div class="th lg" id="'+id+'" style="flex:0 0 120px"')}
function itemBy(barcode,product){if(!D)return null;var b=String(barcode||''),p=String(product||'').toLowerCase();
  return D.items.filter(function(i){return b&&i.barcode===b})[0]||D.items.filter(function(i){return i.product.toLowerCase()===p})[0]||null}

/* ---------- render ---------- */
function renderAll(){if(!D)return;renderDash();renderInv();renderSell();renderSales();
  $('catList').innerHTML=cats().map(function(c){return '<option value="'+esc(c)+'">'}).join('')}
function cats(){var m={};D.items.forEach(function(i){if(i.category)m[i.category]=1});return Object.keys(m).sort()}
function renderDash(){var s=D.stats;
  $('dUpd').textContent='Updated '+D.generated.slice(5,16).replace('-','/')+' CT';
  $('dStats').innerHTML=
   '<div class="stat"><span>Total units</span><b>'+s.units.toLocaleString()+'</b></div>'+
   '<div class="stat"><span>Total cost</span><b>'+money0(s.cost)+'</b></div>'+
   '<div class="stat tap" onclick="jumpInv(\'listed\')"><span>FB listed / not</span><b>'+s.listed+' <small class="muted">/ '+s.notListed+'</small></b></div>'+
   '<div class="stat tap'+(s.lowStock?' warn':'')+'" onclick="jumpInv(\'low\')"><span>Low stock (≤1)</span><b>'+s.lowStock+'</b></div>'+
   '<div class="stat tap'+(s.needPhotos?' warn':'')+'" onclick="jumpInv(\'nophoto\')"><span>Need photos</span><b>'+(s.needPhotos||0)+'</b></div>'+
   '<div class="stat"><span>Products</span><b>'+s.skus+'</b></div>';
  var ss=D.salesStats,rows=[['Today','today'],['7 days','d7'],['30 days','d30'],['All time','all']],partial=false;
  $('dSales').innerHTML='<tr><th></th><th>Sales</th><th>Revenue</th><th>Profit</th></tr>'+rows.map(function(r){var b=ss[r[1]];if(b.profitPartial)partial=true;
    return '<tr><td><b>'+r[0]+'</b></td><td>'+b.count+'</td><td>'+money0(b.revenue)+'</td><td class="'+(b.profit>=0?'pos':'neg')+'">'+money0(b.profit)+(b.profitPartial?'*':'')+'</td></tr>'}).join('');
  $('dSalesNote').textContent=partial?'* some sales have no unit cost, so profit excludes them.':''}

  if(val('nFb')&&!okPrice(val('nFb'))&&!confirm('FB price doesn\'t end in 0 or 5. Save anyway?'))return;
  busy=true;msg('Saving item…',true,true);var photos=pending.slice();
  call('addOrUpdate',{barcode:code,product:val('nProduct'),category:val('nCategory'),set:val('nSet'),type:val('nType'),condition:val('nCondition'),qtyDelta:parseInt($('nQty').value)||0,unitCost:val('nCost'),fbPrice:val('nFb'),notes:val('nNotes'),imageUrl:idRes&&idRes.imageUrl||''})
  .then(function(r){return uploadAll(r.item,photos).then(function(it){return it||r.item},function(e){busy=false;msg('Item saved, but a photo failed: '+e.message+'. Open the item and tap Add photos.',false,true);resetScan();after();throw null})})
  .then(function(it){busy=false;msg('Added: '+it.product+' with '+photos.length+' photo'+(photos.length>1?'s':''),true);resetScan();return after()})
  .catch(function(e){if(e)fail(e)})}
renderPending();
</script>
</body>
</html>
